[package]
name = "todoke-bench"
description = "Reproducible performance measurements for todoke (see README.md)."
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/countradooku/todoke"
publish = false

# Isolated from the root workspace, like fuzz/ (see README.md): the consent
# bypass feature below must never be unified into a root workspace build,
# where every shipped crate's tests would compile against it.
[workspace]

# The root workspace's lints, repeated because this is a separate workspace.
[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

# Benchmarks only: every dependency is a development dependency.
[dev-dependencies]
# The benchmarks seal and open content without a signed Accept, which only
# this feature allows (never in a shipped graph; see todoke-crypto's manifest).
# The LAN benchmark runs suite 0x0001 sessions, which only
# `unaudited-suite-0001` allows (PROTOCOL §16; never in a shipped graph).
todoke-crypto = { path = "../crates/todoke-crypto", version = "0.1.0", features = ["insecure-content-without-accept", "unaudited-suite-0001"] }
zeroize = "=1.9.1"

[[bench]]
name = "content"
harness = false

[[bench]]
name = "lan"
harness = false

# Default features off: no plotting or rayon; reports are text only. Not on
# wasm32, where there is nothing to measure and criterion's `alloca`
# dependency would need a C compiler for that target.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
# The LAN benchmark: TCP links, sessions, and their runtime.
futures-io = { version = "=0.3.34", default-features = false, features = ["std"] }
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["mlkem768"] }
todoke-proto = { path = "../crates/todoke-proto", version = "0.1.0" }
todoke-transport = { path = "../crates/todoke-transport", version = "0.1.0" }
tokio = { version = "=1.53.2", default-features = false, features = ["net", "time", "rt"] }
