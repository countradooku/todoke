[workspace]
members = ["crates/*"]
exclude = ["fuzz", "bench"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/countradooku/todoke"
publish = false

# Pins shared by more than one workspace crate (cargo-deny workspace-duplicate).
# Fixture use is not production approval: zeroization and audit evidence are open (O6).
[workspace.dependencies]
# Path dependencies shared by several members (cargo-deny workspace-duplicate).
todoke-crypto = { path = "crates/todoke-crypto", version = "0.1.0" }
todoke-proto = { path = "crates/todoke-proto", version = "0.1.0" }
todoke-discovery = { path = "crates/todoke-discovery", version = "0.1.0" }
todoke-fs = { path = "crates/todoke-fs", version = "0.1.0" }
todoke-core = { path = "crates/todoke-core", version = "0.1.0" }
todoke-daemon = { path = "crates/todoke-daemon", version = "0.1.0" }
todoke-transfer = { path = "crates/todoke-transfer", version = "0.1.0" }
todoke-transport = { path = "crates/todoke-transport", version = "0.1.0", default-features = false }
# RFC 9285 reference: QR fixture generator and Base45 cross-check tests only.
base45 = "=3.2.0"
blake3 = { version = "=1.8.7", features = ["zeroize"] }
ed25519-dalek = "=3.0.0"
# Async I/O traits only (no runtime): the session adapter and the transfer
# driver.
futures-io = { version = "=0.3.34", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
hex = "=0.4.3"
# RustCrypto HMAC: fixture generator and independent layout tests only.
hmac = { version = "=0.13.0", features = ["zeroize"] }
libcrux-chacha20poly1305 = "=0.0.10"
libcrux-curve25519 = "=0.0.9"
libcrux-ed25519 = "=0.0.10"
libcrux-hkdf = "=0.0.9"
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["mlkem768"] }
libcrux-secrets = "=0.0.7"
libcrux-sha2 = "=0.0.9"
# CPACE-RISTR255-SHA512 (draft-irtf-cfrg-cpace-21) for human-code pairing,
# gated by todoke-crypto's `unaudited-code-pairing` (docs/adr/0002-cpace.md).
pakery-core = { version = "=0.6.0", default-features = false }
pakery-cpace = { version = "=0.6.0", default-features = false }
pakery-crypto = { version = "=0.6.0", default-features = false, features = ["ristretto255"] }
# Property tests only.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# The RNG trait of pakery's API (code pairing only).
rand_core = { version = "=0.10.1", default-features = false }
# Local formats and the daemon's IPC (todoke-core, todoke-daemon).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Constant-time comparisons.
subtle = { version = "=2.6.1", default-features = false }
# Unicode normalization tables: the §7.1 NFC check (todoke-proto) and the
# receiver's collision keys (todoke-fs).
unicode-normalization = { version = "=0.1.25", default-features = false }
# Runtime Noise engine (todoke-crypto) and the offline fixture generator
# (todoke-proto). Only `hfs` here; see docs/adr/0001-noise-crate.md.
# Unix system calls without unsafe code: filesystem (todoke-fs,
# todoke-core) and this user's ID for the daemon's IPC check.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
# The LAN transport's async runtime (todoke-transport); features are chosen
# by each user.
tokio = { version = "=1.53.3", default-features = false }
# QUIC v1 / TLS 1.3 to the relay (§10): the client in todoke-transport and the
# server in todoke-relay. aws-lc-rs, TLS 1.3 only, X25519MLKEM768 preferred;
# no 0-RTT, no logging.
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
# Pairing QR codes: drawn in the terminal (todoke-cli) and the desktop app;
# no image output.
qrcode = { version = "=0.14.1", default-features = false }
# The desktop app's UI toolkit (GPUI and its styled components); its tree is
# held to deny-desktop.toml.
gpui-kit = "=0.7.3"
# Command lines: the todoke CLI and the relay server.
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# Certificate parsing for relay key pins (rustls's own verifier crate).
webpki = { package = "rustls-webpki", version = "=0.103.15", default-features = false, features = ["std"] }
# Platform certificate validation for relays without a pinned key (§10).
rustls-platform-verifier = "=0.7.1"
todoke-relay = { path = "crates/todoke-relay", version = "0.1.0" }
snow = { version = "=0.10.0", default-features = false, features = ["hfs"] }
zeroize = "=1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
# cargo-fuzz builds every crate with `--cfg fuzzing`; harness entry points use it.
# Kani (`cargo kani`) sets `--cfg kani`; todoke-transfer's proof harnesses use it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(kani)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
