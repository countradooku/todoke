[package]
name = "todoke-cli"
description = "The command-line adapter for the public todoke core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "todoke"
path = "src/main.rs"

[features]
# Sessions and code pairing (PROTOCOL §16 gates): development builds only.
unaudited-dev = ["todoke-daemon/unaudited-dev"]

[dependencies]
todoke-core.workspace = true
todoke-daemon.workspace = true
# The table of characters that hide or reorder text, for escaping.
todoke-fs.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
clap.workspace = true
clap_complete = "=4.6.11"
# The pairing QR code drawn in the terminal.
qrcode.workspace = true
tokio = { workspace = true, features = ["rt", "time", "io-util", "io-std", "macros", "signal"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# The end-to-end tests drive daemons with sessions enabled.
todoke-daemon = { workspace = true, features = ["unaudited-dev"] }
# Hashes of the files sent and received.
blake3.workspace = true
getrandom.workspace = true
proptest.workspace = true
# A relay node for the remote end-to-end test.
todoke-relay.workspace = true
