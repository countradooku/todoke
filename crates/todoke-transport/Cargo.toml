[package]
name = "todoke-transport"
description = "Transport interfaces for BLE, Wi-Fi P2P, AWDL, USB, LAN, and QUIC relay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["relay"]
# The relay client (§10). Off in the fuzz and bench workspaces, which do
# not need QUIC or TLS.
relay = [
    "dep:quinn",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:webpki",
    "dep:libcrux-sha2",
    "dep:blake3",
    "dep:getrandom",
    "tokio/macros",
]

[dependencies]
todoke-proto.workspace = true
# Never enable a gate feature here (unaudited-suite-0001,
# unaudited-code-pairing, insecure-content-without-accept): this is a
# shipped graph, and scripts/ci/deny-exceptions-dev-only.sh checks it.
todoke-crypto.workspace = true
# Every link is a `futures-io` byte pipe, as the session adapter takes.
futures-io.workspace = true

# The LAN transport: TCP and timers. There are no sockets on
# wasm32-unknown-unknown, so the LAN code is not built there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Dual-stack listening (IPV6_V6ONLY off on every platform) and socket
# options; tokio's `net` feature already depends on it.
socket2 = "=0.6.5"
tokio = { workspace = true, features = ["net", "time", "rt", "sync"] }
# The relay transport (§10, the `relay` feature): QUIC v1 / TLS 1.3,
# validated by the platform or a pinned key.
quinn = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
webpki = { workspace = true, optional = true }
libcrux-sha2 = { workspace = true, optional = true }
# Rendezvous hashing over the relay list.
blake3 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

# A listener's port is its own (SO_EXCLUSIVEADDRUSE), which socket2 does
# not expose: the reviewed call is in the sys crate.
[target.'cfg(windows)'.dependencies]
todoke-sys-windows.workspace = true

# TCP over Apple peer-to-peer Wi-Fi (AWDL) through Network.framework.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
todoke-sys-macos.workspace = true

[dev-dependencies]
proptest.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# Tests run real suite 0x0001 sessions; development builds only.
todoke-crypto = { workspace = true, features = ["unaudited-suite-0001"] }
# The migration test runs a transfer across two sessions.
todoke-transfer.workspace = true
# A valid ML-KEM-768 public credential for test device bindings.
libcrux-ml-kem.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "sync", "macros", "test-util", "io-util"] }
zeroize.workspace = true
# The malicious-relay tests run sessions through a real relay node.
todoke-relay.workspace = true
