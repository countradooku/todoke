[package]
name = "todoke-desktop"
description = "The todoke desktop app (GPUI, through gpui-kit) for macOS, Windows, and Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Sessions and code pairing (PROTOCOL §16 gates): development builds only.
# Without it the app starts, shows that sessions are disabled in this build,
# and can still attach to a development daemon.
unaudited-dev = ["todoke-daemon/unaudited-dev"]
# The mock core and the screenshot tool (examples/screenshots.rs): renders
# every screen off screen with the real renderer. Never in a shipped build.
mock = ["gpui-kit/test-support", "dep:image"]

[[bin]]
name = "todoke-desktop"
path = "src/main.rs"

[[example]]
name = "screenshots"
required-features = ["mock"]

[dependencies]
todoke-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Pairing secrets the window shows are wiped when they go.
zeroize.workspace = true
# Unique names for files replaced atomically.
getrandom.workspace = true

# The window exists only on the desktop platforms; elsewhere (Android, iOS,
# wasm32) the crate is empty and the binary says so.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
# Where the profile lives, and hosting or attaching to the daemon so the
# CLI reaches the same core while the app runs.
todoke-daemon.workspace = true
# The UI toolkit: GPUI and its styled components. No tree-sitter, no
# speech, no JavaScript runtime.
gpui-kit.workspace = true
# The pairing QR code, drawn as quads.
qrcode.workspace = true
# Channels between the UI and the core (executor-agnostic), and the
# runtime of the daemon client's thread.
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
# PNG output of the screenshot tool (`mock` feature only).
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }
# The tray or menu-bar item, and the global shortcut.
tray-icon.workspace = true
global-hotkey.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Whether a tray host runs; autostart and file-manager actions.
todoke-sys-linux.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dev-dependencies]
# Headless windows, simulated input, and the accessibility tree in tests.
gpui-kit = { workspace = true, features = ["test-support"] }
# A daemon to host and attach to in the backend tests: sessions run only in
# a development build (PROTOCOL §16), and a development dependency may
# enable that (as the todoke command's tests do).
todoke-daemon = { workspace = true, features = ["unaudited-dev"] }
