[package]
name = "todoke-crypto"
description = "Cryptographic orchestration and secret ownership for todoke."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exposes `session::UnauditedSuite0001::acknowledge_not_production_ready()`
# outside this crate's own unit tests. PROTOCOL §16 keeps suite 0x0001
# disabled for production (gates O6 and O10), so only test and fuzzing builds
# may enable this. scripts/ci/deny-exceptions-dev-only.sh fails if any shipped
# (non-dev) graph enables it. Not a default feature.
unaudited-suite-0001 = []
# Human-code pairing (PROTOCOL §3.2): CPace from pakery (docs/adr/0002-cpace.md)
# and `pairing::UnauditedCodePairing::acknowledge_not_production_ready()`
# outside this crate's own unit tests. PROTOCOL §16 keeps code pairing
# disabled until gate O2 closes, so, like the suite gate it implies, only test
# and fuzzing builds may enable it; scripts/ci/deny-exceptions-dev-only.sh
# fails if any shipped graph does. Not a default feature.
unaudited-code-pairing = [
    "unaudited-suite-0001",
    "dep:pakery-cpace",
    "dep:pakery-crypto",
    "dep:rand_core",
]
# Exposes `content::AcceptedFile::assume_accepted_without_verification()`
# outside this crate's own unit tests, so that benchmarks can seal and open
# content without a signed Accept. That bypasses the PROTOCOL §7.2 consent
# gate, so only benchmark, fuzzing, and test builds may enable it (the
# content fuzzing harnesses need it too);
# scripts/ci/deny-exceptions-dev-only.sh fails if any shipped graph does.
# Not a default feature.
insecure-content-without-accept = []

# Versions are the reviewed vector-tool pins (workspace dependencies). Fixture use
# is not production approval: zeroization and cargo-vet evidence remain open (O6).
[dependencies]
todoke-proto.workspace = true
# Bao 0.13.1 combined slice encoding for verified segments (PROTOCOL §7.4,
# docs/adr/0003-bao.md).
bao = "=0.13.1"
blake3.workspace = true
# Canonical Ed25519 point-encoding check required alongside strict dalek verification (§1).
curve25519-dalek = "=5.0.0"
ed25519-dalek.workspace = true
# Async I/O traits only (no runtime) for the session adapter.
futures-io.workspace = true
getrandom.workspace = true
# AES-256-GCM for content suite 1 (PROTOCOL §8, docs/adr/0004-content-aead.md).
libcrux-aes = "=0.0.10"
libcrux-chacha20poly1305.workspace = true
libcrux-curve25519.workspace = true
libcrux-hkdf.workspace = true
# HMAC-SHA-256 for the §4.4 ratchet confirmation; libcrux-hkdf depends on it.
libcrux-hmac = "=0.0.9"
libcrux-ml-kem.workspace = true
# The CPU feature checks behind libcrux-aes's implementation choice, so that
# this device advertises AES only where libcrux-aes uses hardware AES (§6).
libcrux-platform = "=0.0.4"
libcrux-secrets.workspace = true
libcrux-sha2.workspace = true
# CPACE-RISTR255-SHA512 per draft-irtf-cfrg-cpace-21 (ADR 0002); optional,
# compiled only with `unaudited-code-pairing` (and in unit tests through the
# development dependencies below).
pakery-cpace = { workspace = true, optional = true }
pakery-crypto = { workspace = true, optional = true }
# The RNG trait pakery's API takes; the adapter feeds it OS randomness drawn
# through getrandom with error handling.
rand_core = { workspace = true, optional = true }
# The reviewed HFS+PSK Noise state machine (O1, docs/adr/0001-noise-crate.md).
# No default resolver or crypto: every primitive comes from libcrux. Never
# enable `risky-raw-split` here; traffic keys must not leave the state machine.
snow.workspace = true
subtle = { version = "=2.6.1", default-features = false }
zeroize.workspace = true

# Browsers expose their CSPRNG only through Web Crypto; getrandom 0.4 has no
# default backend on wasm32-unknown-unknown.
[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
# Independent RFC 9285 implementation for the QR Base45 cross-check.
base45.workspace = true
hex.workspace = true
# Independent HMAC-SHA-256 (RustCrypto) for the §4.3/§4.4 byte-layout tests,
# so they do not recompute with the libcrux code under test.
hmac.workspace = true
# Independent reference for signing tests only. Not a runtime dependency: its
# 0.0.10 signer leaves the expanded secret key on the stack unwiped (§14.2).
libcrux-ed25519.workspace = true
# CPace for unit tests (the optional dependencies above, unconditionally),
# and pakery-core for the draft-21 component vectors.
pakery-core.workspace = true
pakery-cpace.workspace = true
pakery-crypto.workspace = true
proptest.workspace = true
rand_core.workspace = true
serde_json.workspace = true
sha2 = { version = "=0.11.1", default-features = false }
