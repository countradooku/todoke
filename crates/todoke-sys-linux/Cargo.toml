[package]
name = "todoke-sys-linux"
description = "Linux platform integration behind safe Rust interfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Cargo does not support overriding individual inherited workspace lints.
# Keep these tables aligned with workspace.lints except unsafe_code:
# narrowly scoped, reviewed allows are possible only in this boundary crate.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[target.'cfg(target_os = "linux")'.dependencies]
zeroize.workspace = true
# The freedesktop Secret Service over the session bus (pure Rust; already
# in the graph for GPUI's accessibility and portals).
zbus = "=5.19.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
getrandom.workspace = true
