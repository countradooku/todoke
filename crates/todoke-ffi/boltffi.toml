# BoltFFI 0.31.1 (pinned in the workspace): the Swift package, the Android
# AAR's Kotlin and JNI sources, and the npm package (docs/adr/0012-bindings.md).
experimental = []

[cargo]
# Builds from Cargo.lock as committed, never a resolution of their own.
global_args = ["--locked"]

[cargo.command_args]

[package]
name = "todoke"
crate = "todoke_ffi"

[targets.apple]
enabled = true
output = "dist/apple"
# iOS 17 (P17's minimum, docs/adr/0017-ios.md); macOS too, for the Swift tests
# on a Mac. Pack with IPHONEOS_DEPLOYMENT_TARGET set to the same version, so
# C dependencies (aws-lc, blake3) target it too rather than the SDK's.
deployment_target = "17.0"
include_macos = true

[targets.apple.swift]
module_name = "Todoke"
tools_version = "5.9"
error_style = "throwing"

[targets.apple.xcframework]

[targets.apple.spm]
distribution = "local"
layout = "ffi-only"
skip_package_swift = false

[targets.apple.debug_symbols]
enabled = false
format = "zip"
bundle = "unstripped"
standalone_archive = true

[targets.android]
enabled = true
output = "dist/android"
# Android 7 (P16's minimum).
min_sdk = 24

[targets.android.kotlin]
package = "org.todoke.ffi"
# No desktop loader in the AAR (Android loads the library itself); the test
# overlay loads it on a desktop JVM, from java.library.path.
desktop_loader = "none"
api_style = "top_level"
error_style = "throwing"
factory_style = "constructors"

[targets.android.kotlin.desktop_pack]
enabled = false

[targets.android.header]

[targets.android.pack]

[targets.android.link]
# 16 KB pages (Android 15 devices may use them): segments aligned for both.
extra_args = ["-Wl,-z,max-page-size=16384"]

[targets.wasm]
enabled = true
triple = "wasm32-unknown-unknown"
profile = "release"
output = "dist/wasm"

# wasm-opt shrinks the module for the browser; browser mode (P21) turns it
# on with a pinned binaryen. Until then the core does not run in a browser.
[targets.wasm.optimize]
enabled = false

[targets.wasm.npm]
# Never published by CI (packaging/README.md).
package_name = "@todoke/core"
targets = ["bundler", "web", "nodejs"]

[targets.java.jvm]
enabled = false

[targets.java.android]
enabled = false

[targets.dart]
enabled = false

[targets.python]
enabled = false

[targets.csharp]
enabled = false
