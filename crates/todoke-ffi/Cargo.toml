[package]
name = "todoke-ffi"
description = "The thin BoltFFI boundary for mobile and web clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Cargo does not support overriding individual inherited workspace lints.
# Keep these tables aligned with workspace.lints except unsafe_code:
# narrowly scoped, reviewed allows are possible only in this boundary crate.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lib]
# The static and dynamic libraries the Swift package, the Android AAR, and
# the npm package link; the rlib lets the workspace test it.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Sessions and code pairing (PROTOCOL §16 gates): development builds only,
# as for the desktop app and the daemon. Without it the core refuses to
# start (TodokeError::Disabled).
unaudited-dev = ["todoke-core/unaudited-dev"]
# Loopback discovery (`Settings::allow_loopback`), so two cores on one
# machine find each other: the binding tests only. Without it a core asked
# for loopback refuses to start (TodokeError::Invalid).
test-support = []

[dependencies]
todoke-core.workspace = true
boltffi.workspace = true
# The pairing QR code, drawn as modules here: the offer's text crosses only
# when an app asks for it explicitly.
qrcode.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The core's event stream (a broadcast channel), read on a thread of ours.
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(unix)'.dependencies]
# Checking that a descriptor the app hands over is open before adopting it.
rustix.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# Telling the file layer the Android release, which decides whether files
# are published with renameat2 (src/android.rs).
todoke-fs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The storage key in the Keychain (and the Secure Enclave) without crossing
# the boundary.
todoke-sys-macos.workspace = true

[dev-dependencies]
# Sessions in the tests: a development dependency may enable them, as the
# desktop app's and the CLI's tests do.
todoke-core = { workspace = true, features = ["unaudited-dev"] }
getrandom.workspace = true

# Two cores on one machine find each other over loopback, which only a
# test-support build allows: `cargo test -p todoke-ffi --features
# test-support,unaudited-dev`.
[[test]]
name = "two_cores"
required-features = ["test-support", "unaudited-dev"]
