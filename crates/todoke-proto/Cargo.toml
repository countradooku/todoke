[package]
name = "todoke-proto"
description = "Wire-format definitions and bounded parsing for the todoke protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[example]]
name = "generate_vectors"
test = true

[[example]]
name = "generate_handshake_vectors"
test = true

# Reference implementations for the offline, public-fixture generator, plus
# property tests for the runtime codecs.
[dev-dependencies]
proptest.workspace = true
base45 = "=3.2.0"
blake3 = { workspace = true, features = ["traits-preview"] }
ed25519-dalek.workspace = true
hex.workspace = true
hmac = { version = "=0.13.0", features = ["zeroize"] }
libcrux-curve25519 = "=0.0.9"
libcrux-chacha20poly1305.workspace = true
libcrux-ed25519.workspace = true
libcrux-hkdf = "=0.0.9"
libcrux-ml-kem.workspace = true
libcrux-secrets = "=0.0.7"
libcrux-sha2 = "=0.0.9"
rand_core = "=0.6.4"
serde_json.workspace = true
# Offline public-fixture engine only; never enable raw key export in runtime crates.
snow = { version = "=0.9.6", default-features = false, features = ["hfs", "risky-raw-split"] }
zeroize.workspace = true
