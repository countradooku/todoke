[package]
name = "todoke-shell-windows"
description = "The \"Send with todoke\" Explorer command (IExplorerCommand) of the Windows package."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Cargo does not support overriding individual inherited workspace lints.
# Keep these tables aligned with workspace.lints except unsafe_code:
# narrowly scoped, reviewed allows are possible only in this boundary crate.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lib]
# todoke_shell.dll, loaded by Explorer's COM surrogate (dllhost) from the
# package; the rlib only lets the workspace build and test it everywhere.
name = "todoke_shell"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
# COM: the class factory and IExplorerCommand (safe projections and the
# implement macro). Already in the desktop graph through GPUI.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-core.workspace = true
