[package]
name = "todoke-sys-macos"
description = "Apple platform integration (macOS, and the Keychain on iOS) behind safe Rust interfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Cargo does not support overriding individual inherited workspace lints.
# Keep these tables aligned with workspace.lints except unsafe_code:
# narrowly scoped, reviewed allows are possible only in this boundary crate.
[features]
# The desktop app's pieces (login item, Services); the daemon and the CLI
# need only the key store.
desktop = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-service-management"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
zeroize.workspace = true
# The Keychain and the Secure Enclave through safe bindings (already in the
# graph for the relay's platform certificate checks). OSX_10_15: the
# data-protection keychain.
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_15"] }
# Adding an item without the "create or update" of security-framework's
# password helpers: a stored key is never replaced.
core-foundation = "=0.10.1"
# Apple peer-to-peer Wi-Fi (AWDL) through Network.framework (p2p.rs): its
# handlers are blocks, its queues and data dispatch objects.
block2 = "=0.6.2"
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "block2", "objc2"] }
# The login item (SMAppService) and the Services provider behind "Send with
# todoke" in Finder; the same objc2 crates the tray already brings.
objc2 = { workspace = true, optional = true }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSString", "NSURL", "NSObject"] }
objc2-app-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSApplication", "NSPasteboard", "NSPasteboardItem", "NSResponder"] }
objc2-service-management = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
getrandom.workspace = true
