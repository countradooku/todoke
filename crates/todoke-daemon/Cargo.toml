[package]
name = "todoke-daemon"
description = "Background service integration around the public todoke core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Sessions and code pairing (PROTOCOL §16 gates): development builds only.
unaudited-dev = ["todoke-core/unaudited-dev"]

[dependencies]
todoke-core.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["net", "time", "rt", "sync", "macros", "io-util", "signal"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Where the storage key is kept (§16 O9): the platform's secret storage.
[target.'cfg(target_os = "macos")'.dependencies]
todoke-sys-macos.workspace = true

[target.'cfg(windows)'.dependencies]
todoke-sys-windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
todoke-sys-linux.workspace = true

[dev-dependencies]
proptest.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# The server tests run a real core.
todoke-core = { workspace = true, features = ["unaudited-dev"] }
