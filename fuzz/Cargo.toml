[package]
name = "todoke-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# Isolated from the root workspace (see fuzz/README.md).
[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
# The session and code-pairing harnesses drive suite 0x0001 and CPace, both
# gated (PROTOCOL §16); `unaudited-code-pairing` implies the suite gate. The
# content harnesses seal and open without a signed Accept (§7.2), which needs
# `insecure-content-without-accept`. todoke-crypto compiles each fuzzing
# module only with its gate's feature as well as `--cfg fuzzing`.
todoke-crypto = { path = "../crates/todoke-crypto", version = "0.1.0", features = ["unaudited-code-pairing", "insecure-content-without-accept"] }
todoke-proto = { path = "../crates/todoke-proto", version = "0.1.0" }
# The receiver's name mapping, quarantine record codecs, and content-type
# detection (no gate feature; its fuzzing module touches no filesystem).
todoke-fs = { path = "../crates/todoke-fs", version = "0.1.0" }
# The mDNS sighting check (no gate feature; no socket is opened).
todoke-discovery = { path = "../crates/todoke-discovery", version = "0.1.0" }
todoke-transport = { path = "../crates/todoke-transport", version = "0.1.0" }

