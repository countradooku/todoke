[package]
name = "todoke-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# Isolated from the root workspace (see fuzz/README.md).
[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
# The session harnesses drive suite 0x0001, which is gated (PROTOCOL §16).
todoke-crypto = { path = "../crates/todoke-crypto", version = "0.1.0", features = ["unaudited-suite-0001"] }
todoke-proto = { path = "../crates/todoke-proto", version = "0.1.0" }

[[bin]]
name = "proto_device_binding"
path = "fuzz_targets/proto_device_binding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto_revoke"
path = "fuzz_targets/proto_revoke.rs"
test = false
doc = false
bench = false

