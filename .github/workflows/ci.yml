name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Format, lint, and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and components
        run: rustup show
      - name: Install the desktop app's system libraries (Linux)
        run: bash scripts/ci/install-desktop-deps.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: Clippy, the desktop app's mock core and screenshot tool
        run: cargo clippy -p todoke-desktop --all-targets --features mock --locked -- -D warnings -W clippy::pedantic
      - name: Clippy, the binding with its test support
        run: cargo clippy -p todoke-ffi --all-targets --features test-support,unaudited-dev --locked -- -D warnings -W clippy::pedantic
      - name: Test, including documentation
        # Every crate's results, even after one fails.
        run: cargo test --workspace --locked --no-fail-fast
      # Two cores over loopback, which only the binding's test support allows.
      - name: Test the binding end to end
        run: cargo test -p todoke-ffi --features test-support,unaudited-dev --locked --no-fail-fast
      # The workspace's tests enable the development gates; built alone,
      # the core and the shipped binary must refuse to start sessions.
      - name: Check that release builds keep sessions disabled
        run: |
          cargo test -p todoke-core --lib --locked
          cargo build -p todoke-cli --locked
          home="$(mktemp -d)"
          if TODOKE_HOME="$home" target/debug/todoke daemon run 2> "$home/err"; then
            echo "the daemon started without the development gates" >&2
            exit 1
          fi
          grep -q "sessions are disabled" "$home/err"

  supply-chain:
    name: Dependency policy and audits
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show
      - name: Install pinned dependency tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-vet --version 0.10.2 --locked
      - name: Check licenses, advisories, bans, and sources
        # A stale skip entry fails rather than lingering after upstream converges.
        run: cargo deny --locked check -D unmatched-skip
      - name: Check deny exceptions stay in dev-dependencies
        run: bash scripts/ci/deny-exceptions-dev-only.sh
      - name: Test the deny exception guard
        run: bash scripts/ci/deny-exceptions-dev-only.test.sh
      - name: Check fuzzing-only modules need their gate features
        run: bash scripts/ci/fuzzing-gates.test.sh
      - name: Check the Kani job lists every proof harness
        run: bash scripts/ci/kani-harnesses.sh
      - name: Check the desktop app's dependency policy (the whole graph)
        run: cargo deny --locked --config deny-desktop.toml check -D unmatched-skip
      - name: Check dependency audits
        run: cargo vet --locked
      - name: Check fuzz dependency policy and audits
        if: ${{ hashFiles('fuzz/Cargo.toml') != '' }}
        run: |
          cargo deny --manifest-path fuzz/Cargo.toml --locked --config deny.toml check
          cargo vet --manifest-path fuzz/Cargo.toml --locked
      - name: Check benchmark dependency policy and audits
        run: |
          cargo deny --manifest-path bench/Cargo.toml --locked --config deny.toml check
          cargo vet --manifest-path bench/Cargo.toml --locked

  msrv:
    name: Minimum supported Rust (1.95.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the MSRV
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install the desktop app's system libraries
        run: bash scripts/ci/install-desktop-deps.sh
      - name: Check every workspace target on the MSRV
        run: cargo check --workspace --all-targets --locked
      - name: Check the benchmark workspace on the MSRV
        run: cargo check --manifest-path bench/Cargo.toml --all-targets --locked

  # bench/ is an isolated workspace (bench/README.md): its consent-bypass
  # feature must stay out of root workspace builds.
  bench:
    name: Benchmarks build and run once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and components
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --manifest-path bench/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path bench/Cargo.toml --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: Build the benchmarks
        run: cargo bench --manifest-path bench/Cargo.toml --locked --no-run
      - name: Run each benchmark once (criterion test mode)
        run: cargo test --manifest-path bench/Cargo.toml --locked --benches

  # P10 acceptance (docs/adr/0008-core-daemon-cli.md): two daemon processes
  # pair by code, send a 2 GiB folder, the receiver is killed half-way and
  # restarted, the transfer resumes with a fresh Accept, and every file and
  # the signed receipt are checked. Release build: 2 GiB through debug-built
  # cryptography would take too long. The 96 MiB variant runs in every
  # native test job. Sessions need the development gates, which only the
  # test's own dev-dependency enables.
  acceptance:
    name: Two daemons, 2 GiB, crash and resume
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show
      - name: Run the 2 GiB acceptance test
        run: cargo test --release --locked -p todoke-cli --test e2e -- --ignored

  # PROTOCOL §10: two daemons in Linux network namespaces behind NATs of
  # each type, a relay on the "public" network; they pair by QR and send a
  # file through it, driven by the CLI. They never reach each other
  # directly (no hole punching, §16 O7).
  nat:
    name: Relay behind ${{ matrix.nat }} NATs
    strategy:
      fail-fast: false
      matrix:
        nat: [full-cone, port-restricted, symmetric]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show
      - name: Build the daemon (development gates) and the relay
        run: cargo build --release --locked -p todoke-cli --features todoke-cli/unaudited-dev -p todoke-relay
      - name: Pair and send through the relay
        env:
          NAT: ${{ matrix.nat }}
        run: sudo scripts/ci/nat-relay.sh "$NAT" target/release/todoke target/release/todoke-relay

  # 10000 concurrent rendezvous on one relay node (20000 QUIC connections),
  # every tunnel open together.
  relay-load:
    name: Relay, 10000 concurrent rendezvous
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show
      - name: Run the load test
        run: cargo test --release --locked -p todoke-relay --test load -- --ignored --nocapture

  # The self-hosting image builds, starts, and prints its key pin.
  relay-image:
    name: Relay container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -f crates/todoke-relay/Dockerfile -t todoke-relay:ci .
      - name: Start it and read its pin
        run: |
          docker run -d --name relay --read-only --cap-drop ALL todoke-relay:ci --name relay.test
          for _ in $(seq 50); do
            if docker logs relay 2>&1 | grep -q '^pin spki-sha256:[0-9a-f]\{64\}$'; then
              docker rm -f relay > /dev/null
              exit 0
            fi
            sleep 0.2
          done
          docker logs relay
          exit 1

  # Kani proof harnesses for the receiver's consent gate (todoke-transfer's
  # gate_proofs module; docs/adr/0005-consent-api.md). Installed as Kani's
  # install guide describes (cargo install kani-verifier, then cargo kani
  # setup, which downloads Kani's own pinned nightly toolchain), at an exact
  # release. Kani supports x86_64 Linux hosts.
  kani:
    name: Kani proofs (consent gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KANI_VERSION: 0.68.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      # Every harness is named exactly: with --exact, Kani 0.68.0 fails when
      # a --harness filter matches nothing (kani-driver metadata.rs), and the
      # summary must report each one verified. A harness that is gated out or
      # renamed therefore fails this job instead of passing with "No proof
      # harnesses were found". scripts/ci/kani-harnesses.sh (supply-chain job)
      # checks this list against the #[kani::proof] functions.
      - name: Check the consent-gate harnesses
        run: |
          set -euo pipefail
          harnesses=(
            gate_proofs::kani_harnesses::consent_gate_invariant
            gate_proofs::kani_harnesses::no_key_or_content_before_accept
            gate_proofs::kani_harnesses::no_key_or_content_after_close
            gate_proofs::kani_harnesses::content_only_for_selected_keyed_files
          )
          filters=()
          for harness in "${harnesses[@]}"; do
            filters+=(--harness "$harness")
          done
          # GNU time, when present, reports peak memory (CBMC can exhaust the
          # runner; see gate_proofs.rs).
          timer=()
          if [[ -x /usr/bin/time ]]; then
            timer=(/usr/bin/time -v)
          fi
          ${timer[@]+"${timer[@]}"} cargo kani -p todoke-transfer --exact "${filters[@]}" 2>&1 | tee "$RUNNER_TEMP/kani.log"
          count=${#harnesses[@]}
          grep -Fx "Complete - $count successfully verified harnesses, 0 failures, $count total." "$RUNNER_TEMP/kani.log"
      # Longer consent sequences, exhaustively: a bounded model check beyond
      # two steps does not fit in the runner's memory (gate_proofs.rs).
      - name: Check every six-step consent-gate sequence
        run: >-
          cargo test --release --locked -p todoke-transfer --lib --
          --ignored --exact gate_proofs::tests::consent_gate_invariant_exhaustive_six_steps

  cross:
    name: Check ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-24.04
          - target: aarch64-apple-ios
            os: macos-15
          - target: wasm32-unknown-unknown
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and target
        env:
          CHECK_TARGET: ${{ matrix.target }}
        run: |
          rustup show
          rustup target add "$CHECK_TARGET"
      # blake3's build script compiles C for the target. Use the runner's default
      # NDK (ANDROID_NDK_HOME, see actions/runner-images Ubuntu 24.04) at API 24,
      # the planned Android minSdk.
      - name: Point the C toolchain at the Android NDK
        if: ${{ matrix.target == 'aarch64-linux-android' }}
        run: |
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android24-clang"
          test -x "$bin/llvm-ar"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
      # This is a compile check. Device linking and execution need platform SDKs.
      - name: Check every workspace target
        env:
          CHECK_TARGET: ${{ matrix.target }}
        run: cargo check --workspace --all-targets --locked --target "$CHECK_TARGET"

  fuzz:
    name: Fuzz smoke (60 seconds per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FUZZ_TOOLCHAIN: nightly-2026-08-20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fuzzing tools when harnesses exist
        if: ${{ hashFiles('fuzz/Cargo.toml') != '' }}
        run: |
          rustup show
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --component rust-src
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run every fuzz target, or report the empty scaffold
        run: bash scripts/ci/fuzz-smoke.sh
      - name: Preserve failing inputs
        if: ${{ failure() && hashFiles('fuzz/artifacts/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: error
          retention-days: 14
